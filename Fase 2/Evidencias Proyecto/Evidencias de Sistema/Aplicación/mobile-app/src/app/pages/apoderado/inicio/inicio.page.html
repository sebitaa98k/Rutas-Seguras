<ion-content [fullscreen]="true">
  <main class="page-container">
    <header class="welcome-section rs-page-header">
      <div class="welcome-info">
        <p class="welcome-text">Bienvenido/a</p>
        <h1>Rutas Seguras</h1>
      </div>

      <ion-menu-toggle menu="main-menu">
        <button class="profile-button rs-header-action" type="button" aria-label="Abrir gestiones">
          <span>☰</span>
        </button>
      </ion-menu-toggle>
    </header>

    <section>
      <div class="section-header">
        <div>
          <span class="section-label">TRANSPORTE</span>
          <h2>Mis hijos</h2>
        </div>
      </div>

      <div class="child-card">
        <div class="child-info">
          <div class="child-avatar">👧</div>
          <div class="child-text">
            <h3>Mis hijos</h3>
            <p>Información de transporte escolar</p>
          </div>
        </div>

        <div class="child-status">
          <span class="status-dot"></span>
          <span>Servicio activo</span>
        </div>

        <ion-button expand="block" class="primary-button" routerLink="/apoderado/mis-hijos">
          Ver mis hijos
        </ion-button>
      </div>
    </section>

    <section>
      <div class="section-header tracking-header">
        <div>
          <span class="section-label">EN TIEMPO REAL</span>
          <h2>Seguimiento</h2>
        </div>
      </div>

      <div class="tracking-card">
        <div class="tracking-icon">🚌</div>
        <div class="tracking-info">
          <h3>Seguimiento de ruta</h3>
          <p>Consulta dónde se encuentra el transporte de tus hijos.</p>
        </div>
        <ion-button fill="outline" class="secondary-button" routerLink="/apoderado/seguimiento">
          Ver ruta
        </ion-button>
      </div>
    </section>

    <footer class="footer-message">
      <span>🚌</span>
      <p>Tu ruta escolar, más segura.</p>
    </footer>
  </main>
</ion-content>
